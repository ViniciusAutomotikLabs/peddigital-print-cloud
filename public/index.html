<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#632626" />
    <title>PedDigital · Pedido</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">PedDigital</p>
        <h1>Faça seu pedido</h1>
        <p id="mode-label" class="hint-inline">Funciona no 4G/5G · não precisa do Wi‑Fi do salão</p>
      </div>
    </header>

    <section class="meta">
      <label>Mesa <input id="mesa" type="text" value="12" inputmode="numeric" /></label>
      <label>Comanda <input id="comanda" type="text" value="T1" /></label>
    </section>

    <nav class="tabs">
      <button type="button" class="tab active" data-cat="all">Tudo</button>
      <button type="button" class="tab" data-cat="comida">Comida</button>
      <button type="button" class="tab" data-cat="bebida">Bebida</button>
    </nav>

    <main id="menu" class="menu"></main>

    <section class="cart-panel">
      <div class="cart-head"><strong>Carrinho</strong><span id="cart-count">0</span></div>
      <ul id="cart-list" class="cart-list"></ul>
      <label class="note">Observação <input id="note" type="text" placeholder="Sem cebola..." /></label>
      <button type="button" id="btn-send" class="primary" disabled>Enviar pedido</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <script type="module" src="/app.js"></script>
  </body>
</html>
